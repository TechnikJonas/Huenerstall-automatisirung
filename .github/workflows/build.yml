name: Build Verteilungsplaner

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Verteilungsplaner.sln

      - name: Build
        run: dotnet build Verteilungsplaner.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Verteilungsplaner.Tests -c Release --no-build --verbosity normal

      - name: Publish (Windows x64, eine .exe)
        run: >
          dotnet publish src/Verteilungsplaner.App/Verteilungsplaner.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Verteilungsplaner-win-x64
          path: publish/Verteilungsplaner.exe
